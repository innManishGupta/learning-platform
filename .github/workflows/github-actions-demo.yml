name: Angular CI/CD to IIS
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    env:
      BUILD_OUTPUT: www
      IIS_PATH: C:\TestCICD-manish

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Ionic CLI
        run: npm install -g @ionic/cli
        
      - name: Install dependencies
        run: npm install

      - name: Build Ionic app
        run: ionic build --prod

      - name: Deploy to IIS folder
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_OUTPUT\*"
          $destination = $env:IIS_PATH

          if (-not (Test-Path $destination)) {
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
          }

          Remove-Item -Path "$destination\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path $source -Destination $destination -Recurse -Force

          Write-Host "Deployed to $destination"
          Get-ChildItem -Path $destination | Select-Object Name, Length
